# Copy to config/config.yaml and adjust as needed
model:
  path: models/xgb_fraud_model.joblib
  threshold: 0.5
  retrain_f1_threshold: 0.85

data:
  raw_path: data/raw/creditcard.csv
  processed_dir: data/processed
  test_size: 0.15
  val_size: 0.15

training:
  n_trials: 50
  random_state: 42
  use_smote: true

monitoring:
  drift_p_value: 0.05
  drift_fraction_threshold: 0.20
  report_dir: monitoring/reports

mlflow:
  tracking_uri: mlruns
  experiment_name: fraud-detection-xgboost

api:
  workers: 2
  log_level: info
